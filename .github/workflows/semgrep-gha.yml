name: semgrep check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:                      
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1 
        with:
          fetch-depth: 0
      
      - name: Semgrep scan
        run: semgrep scan --config p/python --sarif --output semgrep.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: semgrep.sarif

      - name: Gate on new ERROR findings
        if: github.event_name == 'pull_request'
        run: |
          semgrep scan \
          --config p/python \
          --baseline-commit "${{ github.event.pull_request.base.sha }}" \
          --severity ERROR \
          --json --output new.json 
        
          expired=$(jq --arg today "$(date +%F)" '[.[] | select(.expires < $today)] | length' .github/security/semgrep-allowlist.json)

          if [ "$expired" -gt 0 ]; then
            echo "Allowlist has expired entries"
            exit 1
          fi

          left=$(jq --slurpfile allow .github/security/semgrep-allowlist.json '[.results[] | select(.check_id as $c | .path as $p | ($allow[0] | any(.id == $c and .location == $p)) | not)] | length' new.json)

          if [ "$left" -gt 0 ]; then
            echo "New ERROR findings not in the allowlist: $left"
            exit 1
          fi


