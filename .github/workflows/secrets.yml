name: secrets scan

on:
  pull_request:
    branches:
      - master
  schedule:                    # Nightly full-history scan
    - cron: "0 2 * * *"        # Every day at 02:00 UTC
  workflow_dispatch:           

permissions:
  contents: read

jobs:
  gitleaks:
    if: github.event_name == 'pull_request'          # Only on PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    container:
      image: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Trust workspace directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Scan PR commits
        run: |
          n=$(git rev-list --count "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          echo "commits to scan: $n"
          [ "$n" -gt 0 ] || { echo "no commits in range: refusing to pass"; exit 1; }
          gitleaks git --redact --no-banner -v \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --report-format sarif --report-path gitleaks.sarif

      # Runs even when the scan fails, so the finding that blocked the PR is recorded too
      - name: Upload to Code Scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks-pr

  gitleaks-history:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    container:
      image: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Trust workspace directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Scan full history
        run: |
          n=$(git rev-list --count HEAD)
          echo "commits to scan: $n"
          [ "$n" -gt 0 ] || { echo "no commits found: refusing to pass"; exit 1; }
          gitleaks git --redact --no-banner -v \
            --report-format sarif --report-path gitleaks.sarif

      - name: Upload to Code Scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks-history
