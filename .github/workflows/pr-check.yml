name: PR check 

on: 
  pull_request:
    branches: [master]

permissions:
  contents: read 

jobs: 
  pr-check:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: run script check 
        run: bash ci/check.sh
        