name: Build image 

on: 
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read 



jobs: 
  build:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: 3.11

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      #/xssL → 302 (healthy, redirects to login to indicate this route is healthy)
      
      - name: Smoke test  
        run: |
          python manage.py runserver 127.0.0.1:8000 & sleep 5
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/xssL
          curl -sf -o /dev/null http://127.0.0.1:8000/xssL 
      
      - name: Django test
        run: |
          python manage.py test

      - name: Build image 
        run: |
          docker build -t pygoatapp . 