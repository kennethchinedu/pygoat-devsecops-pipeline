name: Release

on:
  push:
    branches: [ master]

permissions:
  contents: read
  packages: write        
  id-token: write        
  attestations: write    

jobs:
  release:
    outputs:
      digest: ${{ steps.push.outputs.digest }} 

    runs-on: ubuntu-latest

    steps: 

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: |
          docker build -t ghcr.io/kennethchinedu/pygoat:${{ github.sha }} .
      
      - name: Sign in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        id: push                          # an ID so later steps can refer to this step
        run: |
          docker push ghcr.io/kennethchinedu/pygoat:${{ github.sha }}
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/kennethchinedu/pygoat:${{ github.sha }} | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Show digest
        run: |
          echo "Pushed digest: ${{ steps.push.outputs.digest }}"

      - name: Install cosign
        run: |
          curl -sSfL -o cosign-linux-amd64 https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          curl -sSfL -o cosign_checksums.txt https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign_checksums.txt
          grep ' cosign-linux-amd64$' cosign_checksums.txt | sha256sum -c -
          sudo install cosign-linux-amd64 /usr/local/bin/cosign

      - name: Sign image
        run: |
          cosign sign --yes ghcr.io/kennethchinedu/pygoat@${{ steps.push.outputs.digest }}

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/kennethchinedu/pygoat
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:0.75.0 image --format cyclonedx --output /out/sbom.cdx.json \
            ghcr.io/kennethchinedu/pygoat:${{ github.sha }}

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/kennethchinedu/pygoat
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

  verify:
    runs-on: ubuntu-latest
    needs: release 

    

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install cosign
        run: |
          curl -sSfL -o cosign-linux-amd64 https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          curl -sSfL -o cosign_checksums.txt https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign_checksums.txt
          grep ' cosign-linux-amd64$' cosign_checksums.txt | sha256sum -c -
          sudo install cosign-linux-amd64 /usr/local/bin/cosign
      
      - name: Verify image signature
        run: |
          cosign verify ghcr.io/kennethchinedu/pygoat@${{ needs.release.outputs.digest }} \
          --certificate-identity-regexp '^https://github.com/kennethchinedu/pygoat/\.github/workflows/release\.yml@' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
      
      - name: Verify attestations 
        run: |
          gh attestation verify oci://ghcr.io/kennethchinedu/pygoat@${{ needs.release.outputs.digest }} \
          -R kennethchinedu/pygoat
        env:
          GH_TOKEN: ${{ github.token }}



      
      








