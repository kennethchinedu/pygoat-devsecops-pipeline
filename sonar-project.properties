sonar.projectKey=kennethchinedu_pygoat-devsecops-pipeline
sonar.organization=kennethchinedu
sonar.host.url=https://sonarcloud.io

sonar.sources=.
sonar.python.version=3.11
# Custom Semgrep rule fixtures are deliberately vulnerable code
sonar.exclusions=semgrep-rule/**

# No test suite produces coverage reports yet, so every PR would read 0% and fail the gate
# for a reason unrelated to security. Skip coverage until real tests exist (Python track P05).
sonar.coverage.exclusions=**/*

# Fail the scan step when the quality gate fails, so the PR check is red
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
