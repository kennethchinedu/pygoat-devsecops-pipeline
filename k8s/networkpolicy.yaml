apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: pygoat
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-in
  namespace: pygoat
spec:
  podSelector:
    matchLabels:
      app: pygoat
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8000
          protocol: TCP



